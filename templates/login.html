<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}"
    />
    <title>Login - AI Learning</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* General Page Styles */
      body {
        font-family: "Comic Sans MS", cursive, sans-serif;
        background-color: #d1f9fa;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        text-align: center;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
      }

      /* Container Styling */
      .container {
        padding: clamp(15px, 3vw, 25px);
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        background-color: #ffd685;
        width: 100%;
        max-width: 650px;
        margin-top: clamp(10px, 2vh, 20px);
      }

      h2 {
        color: black;
        font-size: clamp(19px, 2.6vw, 26px);
        margin-top: 0;
        margin-bottom: 10px;
      }

      /* Fun Fact / Privacy Section */
      .fun-fact {
        background: #f0f8ff;
        padding: 12px;
        border-radius: 6px;
        font-size: clamp(15px, 1.6vw, 20px);
        line-height: 1.4;
        color: black;
        margin-bottom: 15px;
        text-align: left;
      }

      .fun-fact p {
        margin: 0 0 8px 0;
      }

      .fun-fact p:last-child {
        margin-bottom: 0;
      }

      button {
        width: 150px;
        padding: 8px 12px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
        display: block;
        margin: 10px auto;
        font-family: inherit;
      }

      button:hover {
        background-color: #0056b3;
      }

      #aboutContainer {
        position: absolute;
        top: 10px;
        right: 20px;
        z-index: 10;
      }

      #aboutButton {
        width: auto;
        margin: 0;
        padding: 10px;
        font-size: 14px;
        font-weight: bold;
        background-color: #ffa500;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      #aboutButton:hover {
        background-color: #cc7000;
      }

      .page-title {
        display: block;
        font-size: 48px;
        font-weight: bold;
        color: Black;
        text-align: center;
        margin-top: clamp(20px, 5vh, 40px);
        margin-bottom: clamp(10px, 2vh, 20px);
        width: auto;
        max-width: min(450px, 100%);
        max-height: 28vh;
        height: auto;
        background: transparent;
      }

      @media (max-width: 900px) {
        .container {
          max-width: 90%;
        }
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        body {
          padding: 12px;
          justify-content: flex-start;
        }

        .page-title {
          font-size: 28px;
          max-width: 95%;
          margin-top: 56px;
          max-height: 22vh;
        }

        h2 {
          font-size: 20px;
        }

        .fun-fact {
          font-size: 16px;
        }

        button {
          font-size: 16px;
          width: 100%;
        }
        #aboutButton {
          font-size: 13px;
          width: auto;
          padding: 8px 10px;
        }

        #aboutContainer {
          top: 8px;
          right: 10px;
        }
      }

      /* Short windows: tighten everything so the card stays visible */
      @media (max-height: 640px) {
        .page-title {
          margin-top: 12px;
          margin-bottom: 8px;
          max-height: 20vh;
        }

        .fun-fact {
          font-size: 15px;
          padding: 10px;
        }

        .container {
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="aboutContainer">
      <a href="/about" style="text-decoration: none">
        <button type="button" id="aboutButton">About</button>
      </a>
    </div>

    <img
      src="{{ url_for('static', filename='images/chatgptnew.png') }}"
      alt="LLM-Probability"
      class="page-title"
    />

    <div class="container">
      <h2>
        Welcome to LLM-Probability!
        <!-- <img
          src="{{ url_for('static', filename='images/ChatGPT1.png') }}"
          alt="AI"
          style="vertical-align: middle; width: 50px; height: auto"
        />! -->
      </h2>

      <div class="fun-fact">
        <p><b>Privacy Note</b></p>
        <p>
          This educational web app does not collect, store, or share any data
          from users. We do not require accounts, and we do not ask users to
          provide personal data to use the app. The app is intended for learning
          purposes only.
        </p>
      </div>

      <!-- Redirects the user to the auto_login route in app.py -->
      <a href="/auto_login" style="text-decoration: none">
        <button type="button" id="lets-play-btn">Let's Explore</button>
      </a>
    </div>
  </body>
</html>
